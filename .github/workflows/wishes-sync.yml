# Keeps the wish board (publit.eu/wuensche, the features page and, via the API, the apps) in sync with
# GitHub: tools/wishes_sync.py links the issues that "Wishes to issues" (elija-7580/Publit) filed for
# new wishes, derives each
# wish's status from its linked issues and lists issues labelled "roadmap" for the features page.
# Writes wuensche/status.json, links.json and roadmap.json. Runs every 30 minutes; if anything
# changed it opens a pull request, merges it after the website check and deploys.
name: Wishes sync
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
concurrency: wishes-sync
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Links, status and roadmap from GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/wishes_sync.py
      - name: Pull request, check, merge, deploy
        # main only takes pull requests with a green "Website check". The bot can merge its own PR only
        # if "GitHub Actions" is on the bypass list of the main ruleset; otherwise the PR stays open.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git add wuensche/status.json wuensche/links.json wuensche/roadmap.json
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          python3 tools/check_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          # One branch and one pull request that every run updates, so nothing piles up.
          branch="generated/wishes"
          git commit -m "Wishes synced with GitHub issues"
          git push -f origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          [ -n "$pr" ] || pr=$(gh pr create --base main --head "$branch" --title "Wishes synced with GitHub issues" \
                 --body "Generated by the Wishes sync workflow and updated by every run. Merge it to publish the new statuses and issue links.") || {
            echo "::warning::Could not open the pull request. Check Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
            exit 1; }
          echo "PR: $pr" >> "$GITHUB_STEP_SUMMARY"
          # Pull requests by github-actions start no workflows; start the website check directly.
          gh workflow run website-check.yml --ref "$branch"
          # The ruleset of main may not let the bot merge; then the PR stays open for a person.
          sleep 60
          if gh pr merge "$pr" --squash; then
            gh workflow run deploy.yml --ref main
          else
            echo "::notice::Not merged automatically (rules of main). Merge $pr to publish."
          fi
