# Keeps the wish board (publit.eu/wuensche, the features page and, via the API, the apps) in sync with
# GitHub: tools/wishes_sync.py files new wishes as issues in elija-7580/Publit (needs the secret
# WISHES_ISSUE_TOKEN, see services/wishes/README.md; without it this step is skipped), derives each
# wish's status from its linked issues and lists issues labelled "roadmap" for the features page.
# Writes wuensche/status.json, links.json and roadmap.json. Runs every 30 minutes; if anything
# changed it commits to main and deploys.
name: Wishes sync
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
concurrency: wishes-sync
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Issues for new wishes, status and roadmap from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          WISHES_ISSUE_TOKEN: ${{ secrets.WISHES_ISSUE_TOKEN }}
          WISHES_ISSUE_MIN_VOTES: ${{ vars.WISHES_ISSUE_MIN_VOTES }}
          WISHES_ISSUE_MIN_HOURS: ${{ vars.WISHES_ISSUE_MIN_HOURS }}
        run: python3 tools/wishes_sync.py
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          files="wuensche/status.json wuensche/links.json wuensche/roadmap.json"
          git add $files
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          python3 tools/check_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wishes synced with GitHub issues"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
