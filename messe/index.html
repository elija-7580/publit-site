<!-- Stand screen for trade fairs: departures right outside + "where do you want to go?" route across Europe.
     Built by messe/stand-tafel/quelle/build.py (project files). Data: Transitous (api.transitous.org), country outlines from abdeckung/data/home.json. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Publit · Departures</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="icon" href="/assets/publit.svg">
<style>
:root{--ink:#141412;--card:#1d1d1b;--line:#2c2c29;--paper:#f4f4f2;--mute:#9a9a94;--yel:#ffc531;--red:#ff5a4e;--ok:#55d17a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:clamp(14px,1.22vw,30px);
  display:grid;grid-template-rows:auto 1fr auto;gap:1.1em;padding:1.4em 1.8em;overflow:hidden;-webkit-font-smoothing:antialiased}
body.hidecursor,body.hidecursor *{cursor:none!important}
button,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:1.2em}
.logo{display:flex;align-items:center;gap:.5em;font-weight:800;font-size:1.6em;letter-spacing:-.02em}
.logo svg{width:1.5em;height:1.5em}
.where{color:var(--mute);font-size:1.05em}
.where b{color:var(--paper);font-weight:600}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:2.2em;letter-spacing:-.02em}
.clock span{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.lang{border:1px solid var(--line);background:none;border-radius:99px;padding:.3em .8em;color:var(--mute);cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,31fr) minmax(0,69fr);gap:1.4em;min-height:0}
section{background:var(--card);border-radius:1.2em;padding:1.2em 1.4em;min-height:0;display:flex;flex-direction:column}
h2{font-size:.82em;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);font-weight:700;display:flex;align-items:center;gap:.6em}
h2 .dot{width:.6em;height:.6em;border-radius:50%;background:var(--yel);box-shadow:0 0 0 0 rgba(255,197,49,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 .6em rgba(255,197,49,0)}100%{box-shadow:0 0 0 0 rgba(255,197,49,0)}}
#deps{list-style:none;margin-top:.8em;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3a3a36 transparent;-webkit-mask-image:linear-gradient(#000 calc(100% - 2.5em),transparent);mask-image:linear-gradient(#000 calc(100% - 2.5em),transparent);padding-bottom:2em}
#deps li{display:grid;grid-template-columns:3.6em 1fr auto;align-items:center;gap:.8em;padding:.62em 0;border-bottom:1px solid var(--line)}
#deps.first li{animation:in .5s both}
#deps li:last-child{border-bottom:0}
@keyframes in{from{opacity:0;transform:translateY(.4em)}}
.badge{display:inline-flex;justify-content:center;align-items:center;min-width:2.6em;height:1.75em;padding:0 .45em;border-radius:.35em;font-weight:800;font-size:1.05em;color:#fff;background:#555;white-space:nowrap}
.badge.TRAM{border-radius:99px}
.badge.BUS{border-radius:.35em}
.dest{min-width:0}
.dest b{display:block;font-size:1.22em;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest small{color:var(--mute);font-size:.82em}
.mins{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mins b{font-size:1.7em;font-weight:800;color:var(--yel)}
.mins small{color:var(--mute);margin-left:.15em}
.mins .then{display:block;color:var(--mute);font-size:.8em}
.now{font-size:1.25em!important;letter-spacing:.04em}
.src{margin-top:.6em;color:#6c6c66;font-size:.72em}
/* route */
.ask{display:flex;align-items:center;gap:1em;flex-wrap:wrap}
.ask h1{font-size:2.6em;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.ask h1 em{font-style:normal;color:var(--yel)}
form{display:flex;gap:.6em;margin-top:.9em}
form input{flex:1;min-width:0;background:var(--ink);border:2px solid var(--line);border-radius:.8em;padding:.6em .9em;font-size:1.3em;outline:none}
form input:focus{border-color:var(--yel)}
body.demo form input{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{border-color:rgba(255,197,49,.75);box-shadow:0 0 0 .35em rgba(255,197,49,.12)}}
form button{background:var(--yel);color:var(--ink);border:0;border-radius:.8em;padding:0 1.3em;font-weight:800;font-size:1.15em;cursor:pointer}
.chips{display:flex;gap:.45em;flex-wrap:wrap;height:2.05em;overflow:hidden;margin-top:.7em}
.chips button{background:none;border:1px solid var(--line);border-radius:99px;padding:.3em .85em;color:var(--paper);cursor:pointer;font-size:.92em}
.chips button:hover,.chips button.on{border-color:var(--yel);color:var(--yel)}
#result{flex:1;min-height:0;margin-top:.9em;border-radius:.9em;overflow:hidden}
#map{position:absolute;inset:0;background:#0b0b0a}
#map svg{width:100%;height:100%;display:block}
#gl,#svgmap{position:absolute;inset:0}
#gl .maplibregl-ctrl-attrib{background:rgba(11,11,10,.7);color:#8d8d86;font-size:11px}
#gl .maplibregl-ctrl-attrib a{color:#8d8d86}
.mk{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;font-weight:800;color:#141412;background:#ffc531;font-size:22px;letter-spacing:-.01em;white-space:nowrap;padding:.12em .5em;border-radius:.45em;box-shadow:0 .2em .8em rgba(0,0,0,.6);margin-bottom:16px}
.mk.dest{background:#f4f4f2}
.mk.s{color:#f4f4f2;background:rgba(11,11,10,.85);border:1px solid #3a3a36;font-size:14px;font-weight:700;margin:0 0 0 12px;padding:.1em .45em;box-shadow:none}
#map .land path{fill:#2f2f2b;stroke:#4a4a44;stroke-width:1;vector-effect:non-scaling-stroke}
#map text{font-weight:700;fill:#f4f4f2;stroke:#0b0b0a;paint-order:stroke;stroke-linejoin:round}
#map text.end{fill:#ffc531}
#map .rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.maplabel{position:absolute;left:.8em;bottom:.6em;color:var(--mute);font-size:.75em}
#info{position:absolute;top:.8em;right:.8em;bottom:.8em;max-height:calc(100% - 1.6em);width:34%;overflow:hidden;display:flex;flex-direction:column;background:rgba(22,22,20,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:.8em;padding:.9em 1em}
#info:has(.hint){background:none;border:0;backdrop-filter:none}
.sum{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
.sum b{font-size:1.9em;font-weight:800;letter-spacing:-.02em}
.sum span{color:var(--mute)}
.legs{list-style:none;margin-top:.6em;overflow:hidden;flex:1}
.legs li{display:grid;grid-template-columns:3.4em 1fr;gap:.7em;padding:.42em 0;border-bottom:1px solid var(--line);align-items:start}
.legs li:last-child{border-bottom:0}
.legs li.more{color:var(--mute);font-size:.85em;padding:.25em 0}
.legs .t{font-variant-numeric:tabular-nums;font-weight:700}
.legs .l b{font-weight:650}
.legs .l small{display:block;color:var(--mute);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legs .m{display:inline-block;font-size:.72em;font-weight:800;border-radius:.3em;padding:.08em .4em;margin-right:.4em;vertical-align:.12em;color:var(--ink);background:var(--yel)}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:.45em .35em;margin-top:.9em;overflow:hidden;flex:1;align-content:flex-start}
.strip .c{display:inline-flex;align-items:center;gap:.35em;background:#2a2a27;border-radius:.55em;padding:.32em .55em;font-weight:700;font-size:1.05em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.strip .c i{font-style:normal;font-size:.7em;font-weight:800;color:var(--ink);border-radius:.3em;padding:.1em .35em}
.strip .c small{color:var(--mute);font-weight:500;font-size:.78em}
.strip .a{color:#5f5f59}
.leave{flex:none;margin-top:.5em;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:901px){.strip{display:none}}
.leave b{color:var(--yel);font-variant-numeric:tabular-nums}
.ops{margin-top:auto;padding-top:.7em;border-top:1px solid var(--line)}
.ops .n{font-size:1em;font-weight:750;line-height:1.25}
.ops .n em{font-style:normal;color:var(--yel)}
.ops .list{color:var(--mute);font-size:.86em;margin-top:.2em}
/* operators band: the main message of the stand, readable from 3 m */
#ops{position:absolute;left:.8em;right:.8em;bottom:.8em;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.2em 1.1em;
  background:rgba(16,16,14,.94);backdrop-filter:blur(8px);border:2px solid rgba(255,197,49,.55);border-radius:.9em;padding:.7em 1.2em .85em .9em;
  box-shadow:0 1em 3em rgba(0,0,0,.55);animation:opsin .6s cubic-bezier(.2,.8,.2,1) both}
#ops[hidden]{display:none}
@keyframes opsin{from{opacity:0;transform:translateY(1.2em)}}
#ops .big{grid-row:1/3;font-size:4.7em;font-weight:900;line-height:.82;letter-spacing:-.06em;color:var(--yel);font-variant-numeric:tabular-nums;text-shadow:0 0 .35em rgba(255,197,49,.35);padding-right:.04em}
#ops .head{font-size:1.5em;font-weight:850;letter-spacing:-.025em;line-height:1.15}
#ops .head span{display:block;color:var(--paper);font-weight:650;font-size:.7em;letter-spacing:0;margin-top:.15em}
#ops .head b{color:var(--red);font-weight:850}
#ops .head em{font-style:normal;color:var(--yel)}
#ops .row{display:flex;flex-wrap:wrap;align-items:center;gap:.3em .25em;margin-top:.3em}
#ops .op{display:inline-flex;align-items:center;gap:.35em;background:#2a2a27;border:1px solid #3a3a36;border-radius:.5em;padding:.16em .5em .16em .25em;font-size:1.28em;font-weight:800;letter-spacing:-.01em;white-space:nowrap;animation:popin .45s cubic-bezier(.2,.8,.2,1.3) both}
#ops .op i{font-style:normal;font-size:.56em;font-weight:900;color:#fff;border-radius:.35em;padding:.18em .42em;letter-spacing:.02em}
#ops .ar{color:var(--yel);font-weight:900;font-size:1.1em;opacity:.8;animation:popin .45s both}
#ops .goal{grid-column:1/-1;margin-top:.45em;padding-top:.45em;border-top:1px solid var(--line);font-size:1.18em;font-weight:650;color:var(--paper)}
#ops .goal b{color:var(--red)}
#ops .goal em{font-style:normal;color:var(--yel);font-weight:850}
@keyframes popin{from{opacity:0;transform:scale(.7)}}
.hint{color:var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;height:100%;padding:1em;font-size:1.1em;line-height:1.4}
.spin{width:2.2em;height:2.2em;border:.25em solid var(--line);border-top-color:var(--yel);border-radius:50%;animation:r 1s linear infinite;margin:0 auto .6em}
@keyframes r{to{transform:rotate(1turn)}}
.auto{color:var(--yel);font-size:.78em;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-left:auto;opacity:0;transition:opacity .4s}
.auto.on{opacity:1}
footer{display:flex;align-items:center;gap:1.4em}
.claim{font-size:1.35em;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.claim span{color:var(--mute);font-weight:500;font-size:.62em;display:block;letter-spacing:0;margin-top:.25em}
.qrs{margin-left:auto;display:flex;gap:1.1em}
.qr{display:flex;align-items:center;gap:.7em;background:var(--card);border-radius:1em;padding:.55em .9em .55em .55em}
.qr svg{width:5.4em;height:5.4em;background:#fff;border-radius:.45em;padding:.25em;display:block}
.qr b{display:block;font-size:1.05em}
.qr small{color:var(--mute);font-size:.82em}
.qr.biz{background:var(--yel);color:var(--ink)}
.qr.biz small{color:#4a3c10}
#result{position:relative}
#show{position:absolute;inset:0;background:var(--card);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:100%;gap:1.4em;align-items:center;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .6s}
#show.on{opacity:1}
#show h3{font-size:2.1em;font-weight:800;letter-spacing:-.03em;line-height:1.08}
#show h3 em{font-style:normal;color:var(--yel)}
#show p{color:var(--mute);margin-top:.5em;font-size:.95em;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em;margin-top:1em}
.stats div{background:var(--ink);border-radius:.8em;padding:.6em .8em}
.stats b{display:block;font-size:1.6em;font-weight:800;letter-spacing:-.03em;color:var(--yel);line-height:1.1}
.stats span{color:var(--mute);font-size:.72em;line-height:1.25;display:block}
.phones{display:flex;align-items:center;align-self:stretch;height:100%;padding:.3em .4em .3em 0}
.ph{position:relative;height:96%;aspect-ratio:1350/2760;flex:none;margin-left:-1.6em;transform:translateY(var(--y,0)) rotate(var(--r,0deg));transition:transform .8s}
.ph:first-child{margin-left:0}
.ph.android{height:92%}
.ph img{position:absolute;left:5.333%;top:2.5%;width:89.334%;height:95%;object-fit:cover;border-radius:12%/5.9%}
.ph::after{content:"";position:absolute;inset:0;background:url(/assets/iphone-17-pro.webp) center/100% 100% no-repeat}
.ph.android{aspect-ratio:1469/3104}
.ph.android img{left:3.948%;top:1.869%;width:91.49%;height:96.39%;border-radius:6%/2.9%}
.ph.android::after{background-image:url(/assets/pixel-8-pro.webp)}
.ph:nth-child(2){z-index:2;--y:-3%}
.ph:nth-child(1){--r:-4deg}.ph:nth-child(3){--r:4deg}
#show.on .ph{animation:rise .8s both}
#show.on .ph:nth-child(2){animation-delay:.12s}#show.on .ph:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(8%)}}
#map .train{filter:drop-shadow(0 0 .4em rgba(255,197,49,.9))}
@media (max-height:860px) and (min-width:901px){
  .ask h1{font-size:2.1em}
  form{margin-top:.6em}
  form input{padding:.45em .8em}
  .chips{margin-top:.55em}
  #result{margin-top:.65em}
  #ops .big{font-size:4.2em}
  .sum b{font-size:1.6em}
}
@media (max-width:900px){
  #show{display:none}
  body{overflow:auto;height:auto;grid-template-rows:auto;font-size:15px;padding:16px}
  main{grid-template-columns:minmax(0,1fr)}
  #result{display:flex;flex-direction:column;gap:.8em;overflow:visible}
  #map,#info,#ops{position:relative;inset:auto;width:auto}
  #ops .big{font-size:4em}
  .chips{height:auto}
  header{flex-wrap:wrap;gap:.6em}
  .where{order:5;width:100%}
  section{display:block}
  #deps{flex:none;max-height:28em}
  .ask h1{font-size:1.8em}
  .qr{flex:1 1 100%}
  #map{height:300px}
  footer{flex-direction:column;align-items:flex-start}
  .qrs{margin-left:0;flex-wrap:wrap}
  .clock{font-size:1.5em}
}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 1024 1024" aria-hidden="true"><g transform="translate(-38 -18)"><path d="M400 790 V420 a150 150 0 1 1 150 150 H400" fill="none" stroke="#f4f4f2" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/><circle cx="550" cy="420" r="58" fill="#ffc531"/></g></svg>Publit</div>
  <div class="where" data-t="where"></div>
  <button class="lang" id="lang" type="button">DE</button>
  <div class="clock" id="clock">--<span>:</span>--</div>
</header>
<main>
  <section>
    <h2><i class="dot"></i><span data-t="depTitle"></span></h2>
    <ul id="deps"><li><div></div><div class="dest"><small data-t="loading"></small></div></li></ul>
    <p class="src" data-t="depSrc"></p>
  </section>
  <section>
    <div class="ask"><h1 data-t="ask"></h1><span class="auto" id="auto" data-t="auto"></span></div>
    <form id="f" autocomplete="off"><input id="q" enterkeyhint="go" data-ph="ph"><button type="submit" data-t="go"></button></form>
    <div class="chips" id="chips"></div>
    <div id="result"><div id="map"><div id="gl"></div><div id="svgmap"></div></div><div id="info"></div><div id="ops" hidden></div>
      <div id="show" aria-hidden="true"><div><h3 data-t="showT"></h3><p data-t="showP"></p>
        <div class="stats"><div><b>2,500</b><span data-t="s1"></span></div><div><b>68</b><span data-t="s2"></span></div><div><b>40</b><span data-t="s3"></span></div><div><b>3.8M</b><span data-t="s4"></span></div></div></div>
        <div class="phones"><div class="ph"><img src="/assets/app/web-nearby-dark.webp" alt=""></div><div class="ph"><img src="/assets/app/web-route-dark.webp" alt=""></div><div class="ph android"><img src="/assets/app/web-plan-android-dark-en.webp" alt=""></div></div></div></div>
  </section>
</main>
<footer>
  <div class="claim"><div data-t="claim"></div><span data-t="sub"></span></div>

  drawMap(it);
  document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('on', CITIES[lang][+b.dataset.i][0] === name));
}
function fitInfo() {
  const band = $('#ops'), info = $('#info');
  const on = innerWidth > 900 && !band.hidden && !info.querySelector('.hint');
  info.style.bottom = on ? 'auto' : '';
  info.style.maxHeight = on ? `calc(100% - ${band.offsetHeight}px - 2.4em)` : '';
  // small screens: drop the "first ride" line instead of cutting it
  const lv = info.querySelector('.leave');
  if (lv) { lv.hidden = false; if (on && lv.getBoundingClientRect().bottom > info.getBoundingClientRect().bottom - 8) lv.hidden = true; }
}
addEventListener('resize', fitInfo);
function idleHint() {
  $('#info').innerHTML = `<div class="hint">${esc(L().idle)}</div>`;
}

/* ---------- demo mode: cycles through cities when nobody touches the screen ---------- */
let demoTimer = null, idleTimer = null, demoIdx = 0, cursorTimer = null;
const IDLE = +(params.get('idle') || 60) * 1000, CYCLE = +(params.get('cycle') || 18) * 1000;
function startDemo() {
  $('#auto').classList.add('on');
  document.body.classList.add('demo');
  let n = 0;
  const step = () => {
    // every third slide shows the app instead of a route
    if (++n % 3 === 0) { $('#show').classList.add('on'); return; }
    $('#show').classList.remove('on');
    const c = CITIES[lang][demoIdx++ % CITIES[lang].length];
    go(c[0], {lat: c[1], lon: c[2]}).then(() => $('#auto').classList.add('on'));
  };
  step();
  demoTimer = setInterval(step, CYCLE);
}
function stopDemo(user) {
  if (!user) return;
  clearInterval(demoTimer); demoTimer = null;
  $('#auto').classList.remove('on');
  $('#show').classList.remove('on');
  document.body.classList.remove('demo');
}
function touched() {
  stopDemo(true);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startDemo, IDLE);
  document.body.classList.remove('hidecursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.add('hidecursor'), 4000);
}
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(e => addEventListener(e, touched, {passive: true}));
addEventListener('pointermove', e => { if (Math.abs(e.movementX) + Math.abs(e.movementY) > 2) touched(); }, {passive: true});

$('#f').addEventListener('submit', e => { e.preventDefault(); const v = $('#q').value.trim(); if (v) { go(v); $('#q').blur(); } });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = CITIES[lang][+b.dataset.i]; $('#q').value = ''; go(c[0], {lat: c[1], lon: c[2]});
});
$('#lang').addEventListener('click', () => { lang = lang === 'en' ? 'de' : 'en'; if (current) current.name = current.name; applyLang(); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
});
addEventListener('resize', () => { renderDeps(); if (current) { const it = best(current.plan); if (it) { it.destName = current.name; drawMap(it); } } });

applyLang();
tick(); setInterval(tick, 1000);
loadDeps(); setInterval(loadDeps, 60e3); setInterval(renderDeps, 15e3);
idleTimer = setTimeout(startDemo, params.has('demo') ? 1500 : 5000);
setTimeout(prefetch, 8000);
// keep the screen awake on laptops and tablets that support it
if ('wakeLock' in navigator) { const w = () => navigator.wakeLock.request('screen').catch(() => {}); w(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && w()); }
</script>
</body>
