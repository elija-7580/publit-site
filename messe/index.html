<!-- Stand screen for trade fairs: departures right outside + "where do you want to go?" route across Europe.
     Built by messe/stand-tafel/quelle/build.py (project files). Data: Transitous (api.transitous.org), country outlines from abdeckung/data/home.json. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Publit · Departures</title>
<link rel="icon" href="/assets/publit.svg">
<style>
:root{--ink:#141412;--card:#1d1d1b;--line:#2c2c29;--paper:#f4f4f2;--mute:#9a9a94;--yel:#ffc531;--red:#ff5a4e;--ok:#55d17a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:clamp(14px,1.05vw,22px);
  display:grid;grid-template-rows:auto 1fr auto;gap:1.1em;padding:1.4em 1.8em;overflow:hidden;-webkit-font-smoothing:antialiased}
body.hidecursor,body.hidecursor *{cursor:none!important}
button,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:1.2em}
.logo{display:flex;align-items:center;gap:.5em;font-weight:800;font-size:1.6em;letter-spacing:-.02em}
.logo svg{width:1.5em;height:1.5em}
.where{color:var(--mute);font-size:1.05em}
.where b{color:var(--paper);font-weight:600}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:2.2em;letter-spacing:-.02em}
.clock span{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.lang{border:1px solid var(--line);background:none;border-radius:99px;padding:.3em .8em;color:var(--mute);cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:1.4em;min-height:0}
section{background:var(--card);border-radius:1.2em;padding:1.2em 1.4em;min-height:0;display:flex;flex-direction:column}
h2{font-size:.82em;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);font-weight:700;display:flex;align-items:center;gap:.6em}
h2 .dot{width:.6em;height:.6em;border-radius:50%;background:var(--yel);box-shadow:0 0 0 0 rgba(255,197,49,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 .6em rgba(255,197,49,0)}100%{box-shadow:0 0 0 0 rgba(255,197,49,0)}}
#deps{list-style:none;margin-top:.8em;flex:1;overflow:hidden}
#deps li{display:grid;grid-template-columns:3.6em 1fr auto;align-items:center;gap:.8em;padding:.62em 0;border-bottom:1px solid var(--line)}
#deps.first li{animation:in .5s both}
#deps li:last-child{border-bottom:0}
@keyframes in{from{opacity:0;transform:translateY(.4em)}}
.badge{display:inline-flex;justify-content:center;align-items:center;min-width:2.6em;height:1.75em;padding:0 .45em;border-radius:.35em;font-weight:800;font-size:1.05em;color:#fff;background:#555}
.badge.TRAM{border-radius:99px}
.badge.BUS{border-radius:.35em}
.dest{min-width:0}
.dest b{display:block;font-size:1.22em;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest small{color:var(--mute);font-size:.82em}
.mins{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mins b{font-size:1.7em;font-weight:800;color:var(--yel)}
.mins small{color:var(--mute);margin-left:.15em}
.mins .then{display:block;color:var(--mute);font-size:.8em}
.now{font-size:1.25em!important;letter-spacing:.04em}
.src{margin-top:.6em;color:#6c6c66;font-size:.72em}
/* route */
.ask{display:flex;align-items:center;gap:1em;flex-wrap:wrap}
.ask h1{font-size:2.3em;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.ask h1 em{font-style:normal;color:var(--yel)}
form{display:flex;gap:.6em;margin-top:.9em}
form input{flex:1;min-width:0;background:var(--ink);border:2px solid var(--line);border-radius:.8em;padding:.6em .9em;font-size:1.3em;outline:none}
form input:focus{border-color:var(--yel)}
form button{background:var(--yel);color:var(--ink);border:0;border-radius:.8em;padding:0 1.3em;font-weight:800;font-size:1.15em;cursor:pointer}
.chips{display:flex;gap:.45em;flex-wrap:wrap;margin-top:.7em}
.chips button{background:none;border:1px solid var(--line);border-radius:99px;padding:.3em .85em;color:var(--paper);cursor:pointer;font-size:.92em}
.chips button:hover,.chips button.on{border-color:var(--yel);color:var(--yel)}
#result{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.2em;margin-top:1em}
#map{background:#121211;border-radius:.9em;overflow:hidden;position:relative;min-height:0}
#map svg{width:100%;height:100%;display:block}
#map .land path{fill:#262624;stroke:#121211;stroke-width:.6;vector-effect:non-scaling-stroke}
#map .rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.maplabel{position:absolute;left:.8em;bottom:.7em;color:var(--mute);font-size:.75em}
#info{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.sum{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
.sum b{font-size:1.9em;font-weight:800;letter-spacing:-.02em}
.sum span{color:var(--mute)}
.legs{list-style:none;margin-top:.6em;overflow:hidden;flex:1}
.legs li{display:grid;grid-template-columns:3.4em 1fr;gap:.7em;padding:.42em 0;border-bottom:1px solid var(--line);align-items:start}
.legs li:last-child{border-bottom:0}
.legs li.more{color:var(--mute);font-size:.85em;padding:.25em 0}
.legs .t{font-variant-numeric:tabular-nums;font-weight:700}
.legs .l b{font-weight:650}
.legs .l small{display:block;color:var(--mute);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legs .m{display:inline-block;font-size:.72em;font-weight:800;border-radius:.3em;padding:.08em .4em;margin-right:.4em;vertical-align:.12em;color:var(--ink);background:var(--yel)}
.ops{margin-top:.7em;background:var(--ink);border-radius:.8em;padding:.75em .9em}
.ops .n{font-size:1.15em;font-weight:750}
.ops .n em{font-style:normal;color:var(--yel)}
.ops .list{color:var(--mute);font-size:.86em;margin-top:.2em}
.hint{color:var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;height:100%;padding:1em;font-size:1.1em;line-height:1.4}
.spin{width:2.2em;height:2.2em;border:.25em solid var(--line);border-top-color:var(--yel);border-radius:50%;animation:r 1s linear infinite;margin:0 auto .6em}
@keyframes r{to{transform:rotate(1turn)}}
.auto{color:var(--yel);font-size:.78em;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-left:auto;opacity:0;transition:opacity .4s}
.auto.on{opacity:1}
footer{display:flex;align-items:center;gap:1.4em}
.claim{font-size:1.5em;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.claim span{color:var(--mute);font-weight:500;font-size:.62em;display:block;letter-spacing:0;margin-top:.25em}
.qrs{margin-left:auto;display:flex;gap:1.1em}
.qr{display:flex;align-items:center;gap:.7em;background:var(--card);border-radius:1em;padding:.55em .9em .55em .55em}
.qr svg{width:5.2em;height:5.2em;background:#fff;border-radius:.45em;padding:.25em;display:block}
.qr b{display:block;font-size:1.05em}
.qr small{color:var(--mute);font-size:.82em}
.qr.biz{background:var(--yel);color:var(--ink)}
.qr.biz small{color:#4a3c10}
@media (max-width:900px){
  body{overflow:auto;height:auto;grid-template-rows:auto;font-size:15px;padding:16px}
  main,#result{grid-template-columns:minmax(0,1fr)}
  header{flex-wrap:wrap;gap:.6em}
  .where{order:5;width:100%}
  section{display:block}
  #deps{flex:none}
  .ask h1{font-size:1.8em}
  .qr{flex:1 1 100%}
  #map{height:300px}
  footer{flex-direction:column;align-items:flex-start}
  .qrs{margin-left:0;flex-wrap:wrap}
  .clock{font-size:1.5em}
}
</style>
</head>

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = L()[e.dataset.t]);
  $('#q').placeholder = L().ph;
  $('#lang').textContent = lang === 'en' ? 'DE' : 'EN';
  $('#chips').innerHTML = CITIES[lang].map((c, i) => `<button type="button" data-i="${i}">${esc(c[0])}</button>`).join('');
  renderDeps();
  if (current) showRoute(current.plan, current.name); else idleHint();
}

/* ---------- clock ---------- */
function tick() {
  const d = new Date(), f = n => String(n).padStart(2, '0');
  const t = new Intl.DateTimeFormat('en-GB', {timeZone: 'Europe/Vienna', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).formatToParts(d);
  const g = k => t.find(p => p.type === k).value;
  $('#clock').innerHTML = `${g('hour')}<span>:</span>${g('minute')}`;
}

/* ---------- departures ---------- */
const MODE_COLOR = {SUBWAY: '#e3000f', TRAM: '#c4161c', BUS: '#0a4a8f', COACH: '#2a7a3d', REGIONAL_RAIL: '#1a6fb5', SUBURBAN: '#1a6fb5', RAIL: '#1a6fb5'};
const U_COLOR = {U1: '#e3000f', U2: '#a762a3', U3: '#eb6a0a', U4: '#319f49', U5: '#63318a', U6: '#9d6830'};
let deps = [];
const strip = s => String(s || '').replace(/^Wien\s+/, '');
async function loadDeps() {
  try {
    const u = `${API}/api/v5/stoptimes?center=${HOME.lat},${HOME.lon}&radius=500&n=80`;
    const r = await fetch(u, {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    deps = (j.stopTimes || []).map(s => ({
      line: s.routeShortName || s.displayName || '', mode: s.mode, color: s.routeColor, text: s.routeTextColor,
      dest: strip(s.headsign), stop: strip(s.place.name), t: new Date(s.place.departure || s.place.scheduledDeparture),
      sched: new Date(s.place.scheduledDeparture || s.place.departure), live: s.realTime
    })).filter(d => d.line && d.t > Date.now() - 60e3);
    renderDeps();
  } catch (e) {
    if (!deps.length) $('#deps').innerHTML = `<li><div></div><div class="dest"><small>${esc(L().err)}</small></div></li>`;
  }
}
function renderDeps() {
  if (!deps.length) return;
  const now = Date.now(), groups = new Map();
  deps.filter(d => d.t >= now - 30e3).sort((a, b) => a.t - b.t).forEach(d => {
    const k = d.line + '|' + d.dest;
    if (!groups.has(k)) groups.set(k, []);
    const g = groups.get(k);
    if (g.length < 3 && !g.some(x => Math.abs(x.t - d.t) < 60e3)) g.push(d);
  });
  const rows = [...groups.values()].slice(0, rowsFit());
  const ul = $('#deps');
  ul.classList.toggle('first', !ul.dataset.done);
  ul.dataset.done = 1;
  $('#deps').innerHTML = rows.map((g, i) => {
    const d = g[0], m = Math.max(0, Math.round((d.t - now) / 60e3));
    const bg = U_COLOR[d.line] || (d.color ? '#' + d.color : MODE_COLOR[d.mode] || '#555');
    const fg = d.text && d.color ? '#' + d.text : '#fff';
    const more = g.slice(1).map(x => Math.max(0, Math.round((x.t - now) / 60e3))).join(', ');
    return `<li style="animation-delay:${i * 40}ms"><span class="badge ${d.mode}" style="background:${bg};color:${fg}">${esc(d.line)}</span>
      <div class="dest"><b>${esc(d.dest)}</b><small>${esc(d.stop)}</small></div>
      <div class="mins">${m === 0 ? `<b class="now">${L().now}</b>` : `<b>${m}</b><small>${L().min}</small>`}${more ? `<span class="then">${L().then} ${more}</span>` : ''}</div></li>`;
  }).join('');
}
function rowsFit() {
  if (innerWidth <= 900) return 6;
  const h = $('#deps').clientHeight, row = parseFloat(getComputedStyle(document.body).fontSize) * 3.35;
  return Math.max(4, Math.min(12, Math.floor(h / row) || 8));
}

/* ---------- map ---------- */
const K = 0.6156614753256583, SX = 22.87703162651752, Y1 = 1.81486224426954, S = K * SX;
const px = lon => (lon + SX) * S;
const py = lat => (Y1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))) * S * 180 / Math.PI;
function decode(str, precision = 6) {
  let i = 0, lat = 0, lon = 0; const out = [], f = Math.pow(10, precision);
  while (i < str.length) {
    for (const which of [0, 1]) {
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if (which === 0) lat += d; else lon += d;
    }
    out.push([lat / f, lon / f]);
  }
  return out;
}
const LEG_COLOR = {WALK: '#8d8d86', SUBWAY: '#ff5a4e', TRAM: '#ff8a5c', BUS: '#6fb7ff', COACH: '#7ee08f', FERRY: '#5ad1e6', AIRPLANE: '#bbb'};
const legColor = m => LEG_COLOR[m] || '#ffc531';
function drawMap(it) {
  const pts = [];
  const lines = it.legs.map(l => {
    const g = l.legGeometry ? decode(l.legGeometry.points, l.legGeometry.precision || 6) : [[l.from.lat, l.from.lon], [l.to.lat, l.to.lon]];
    g.forEach(p => pts.push(p));
    if (g.length < 2) return null;
    return {mode: l.mode, d: 'M' + g.map(p => px(p[1]).toFixed(2) + ' ' + py(p[0]).toFixed(2)).join('L')};
  }).filter(Boolean);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach(p => { const x = px(p[1]), y = py(p[0]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  const box = $('#map'), ar = (box.clientWidth || 4) / (box.clientHeight || 3);
  let w = Math.max(x1 - x0, 40), h = Math.max(y1 - y0, 40);
  w *= 1.25; h *= 1.25;
  if (w / h > ar) h = w / ar; else w = h * ar;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, vb = [cx - w / 2, cy - h / 2, w, h];
  const upp = w / (box.clientWidth || 600), sw = upp * 5;
  const a = it.legs[0].from, z = it.legs[it.legs.length - 1].to;
  const pin = (lat, lon, fill) => `<circle class="pin" cx="${px(lon)}" cy="${py(lat)}" r="${upp * 9}" fill="${fill}" stroke="#121211" stroke-width="${upp * 3}"/>`;
  box.innerHTML = `<svg viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid slice"><g class="land">${COUNTRIES.map(d => `<path d="${d}"/>`).join('')}</g>
    ${lines.map(l => l.mode === 'WALK' ? `<path class="rt walk" d="${l.d}" stroke="#8d8d86" stroke-width="${upp * 2}" stroke-dasharray="${upp * 2} ${upp * 6}"/>` : `<path class="rt" d="${l.d}" stroke="${legColor(l.mode)}" stroke-width="${sw}"/>`).join('')}
    ${pin(a.lat, a.lon, '#ffc531')}${pin(z.lat, z.lon, '#f4f4f2')}</svg><span class="maplabel">${esc(L().mapNote)}</span>`;
  // draw the route leg by leg
  let delay = 0;
  box.querySelectorAll('.rt').forEach(p => {
    if (p.classList.contains('walk')) return;
    const len = p.getTotalLength ? p.getTotalLength() : 0;
    if (!len) return;
    const dur = 500;
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: dur, delay, fill: 'forwards', easing: 'ease-in-out'});
    delay += dur * .8;
  });
}

/* ---------- planning ---------- */
const cache = new Map();
let current = null, busy = 0;
const inEurope = r => r.lat > 34 && r.lat < 72 && r.lon > -25 && r.lon < 45;
async function geocode(text) {
  const r = await fetch(`${API}/api/v1/geocode?text=${encodeURIComponent(text)}&language=${lang}`);
  if (!r.ok) throw new Error('geo');
  const list = (await r.json()).filter(inEurope);
  const pick = list.find(x => x.type === 'PLACE' && /^place_|municipality|city|town/.test(x.category || '')) || list[0];
  if (!pick) return null;
  return {name: pick.name, lat: pick.lat, lon: pick.lon};
}
async function plan(to) {
  const key = `${to.lat.toFixed(3)},${to.lon.toFixed(3)}`, hit = cache.get(key);
  if (hit && Date.now() - hit.at < 10 * 60e3) return hit.plan;
  const u = `${API}/api/v5/plan?fromPlace=${HOME.lat},${HOME.lon}&toPlace=${to.lat},${to.lon}&numItineraries=4&time=${new Date().toISOString()}`;
  const r = await fetch(u);
  if (!r.ok) throw new Error('plan');
  const p = await r.json();
  cache.set(key, {at: Date.now(), plan: p});
  return p;
}
function best(p) {
  const its = (p.itineraries || []).filter(i => i.legs && i.legs.length);
  if (!its.length) return null;
  const firstArr = Math.min(...its.map(i => +new Date(i.endTime)));
  // among the ones arriving within 30 min of the first, take the fewest changes
  return its.filter(i => +new Date(i.endTime) - firstArr <= 30 * 60e3).sort((a, b) => a.transfers - b.transfers || new Date(a.endTime) - new Date(b.endTime))[0];
}
async function go(name, coords) {
  const my = ++busy;
  stopDemo(false);
  $('#info').innerHTML = `<div class="hint"><div><div class="spin"></div>${esc(L().planning)}</div></div>`;
  try {
    const to = coords || await geocode(name);
    if (my !== busy) return;
    if (!to) { $('#info').innerHTML = `<div class="hint">${esc(L().notFound)}</div>`; return; }
    const p = await plan(to);
    if (my !== busy) return;
    current = {plan: p, name: coords ? name : to.name};
    showRoute(p, current.name);
  } catch (e) {
    if (my === busy) $('#info').innerHTML = `<div class="hint">${esc(L().err)}</div>`;
  }
}
const OP_CLEAN = /\s*(GmbH(\s*&\s*Co\.?\s*KG)?|Management GmbH|AG|S\.p\.A\.?|SpA|Zrt\.?|Személyszállítási|a\.s\.|S\.A\.|SA|Ltd\.?|B\.V\.|N\.V\.|sp\. z o\.o\.|d\.o\.o\.|Fernverkehr|Regio|VOYAGEURS|-eu)\b\.?/gi;
const opName = s => String(s || '').split(/ - |,/)[0].replace(OP_CLEAN, ' ').replace(/\s+/g, ' ').trim().replace(/^Wiener Linien.*/, 'Wiener Linien').replace(/^SNCF.*/, 'SNCF').replace(/^MÁV.*/, 'MÁV');
function hhmm(iso, tz) {
  return new Intl.DateTimeFormat('en-GB', {timeZone: tz || 'Europe/Vienna', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).format(new Date(iso));
}
function dayStart(iso, tz) {
  const p = new Intl.DateTimeFormat('en-CA', {timeZone: tz || 'Europe/Vienna', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date(iso));
  return +new Date(p + 'T00:00:00Z');
}
function dur(sec) {
  const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}
const MODE_SHORT = {SUBWAY: 'U', TRAM: 'Tram', BUS: 'Bus', COACH: 'Bus', FERRY: 'Ferry', HIGHSPEED_RAIL: 'Train', LONG_DISTANCE: 'Train', NIGHT_RAIL: 'Night', REGIONAL_FAST_RAIL: 'Train', REGIONAL_RAIL: 'Train', SUBURBAN: 'S', RAIL: 'Train', AIRPLANE: 'Air', FUNICULAR: 'Funi', AERIAL_LIFT: 'Lift'};
function showRoute(p, name) {
  const it = best(p);
  if (!it) { $('#info').innerHTML = `<div class="hint">${esc(L().none)}</div>`; $('#map').innerHTML = ''; return; }
  const ride = it.legs.filter(l => l.mode !== 'WALK');
  const ops = [...new Set(ride.map(l => opName(l.agencyName)).filter(Boolean))];
  const merged = [];
  it.legs.forEach(l => {
    if (l.mode === 'WALK') { const last = merged[merged.length - 1]; if (last && last.mode === 'WALK') last.duration += l.duration; else merged.push({...l}); }
    else merged.push(l);
  });
  let legs = merged.filter(l => l.mode !== 'WALK' || l.duration >= 240).map(l => {
    if (l.mode === 'WALK') return `<li data-walk><span class="t">${hhmm(l.startTime, l.from.tz)}</span><div class="l"><small>${esc(L().walk)} · ${Math.round(l.duration / 60)} min</small></div></li>`;
    const line = l.displayName || l.routeShortName || l.tripShortName || '';
    const delay = Math.round((new Date(l.startTime) - new Date(l.scheduledStartTime)) / 60e3);
    return `<li><span class="t">${hhmm(l.startTime, l.from.tz)}</span><div class="l"><b><span class="m" style="background:${legColor(l.mode)}">${esc(MODE_SHORT[l.mode] || l.mode)}</span>${esc(line)}</b>${delay > 0 ? ` <small style="display:inline;color:var(--red)">+${delay}</small>` : ''}
      <small>${esc(strip(l.from.name) === 'START' ? L().start : strip(l.from.name))} → ${esc(strip(l.to.name) === 'END' ? name : strip(l.to.name))} · ${esc(opName(l.agencyName))}</small></div></li>`;
  });
  if (legs.length > 5) legs = legs.filter(x => !x.includes('data-walk'));
  const fit = innerWidth <= 900 ? 99 : Math.max(3, Math.floor(($('#result').clientHeight - 230) / (parseFloat(getComputedStyle(document.body).fontSize) * 2.75)));
  if (legs.length > fit) legs = [...legs.slice(0, fit - 2), `<li class="more"><span></span><span>+ ${legs.length - fit + 1} ${esc(L().more)}</span></li>`, legs[legs.length - 1]];
  const last = it.legs[it.legs.length - 1];
  const days = Math.round((dayStart(it.endTime, last.to.tz) - dayStart(new Date().toISOString(), 'Europe/Vienna')) / 864e5);
  $('#info').innerHTML = `<div class="sum"><b>→ ${esc(name)}</b><span>${dur(it.duration)} · ${L().changes(it.transfers)} · ${L().arr} ${hhmm(it.endTime, last.to.tz)}${days > 0 ? ` (+${days})` : ''}</span></div>
    <ul class="legs">${legs.join('')}</ul>
    <div class="ops"><div class="n">${ops.length > 1 ? L().ops(ops.length) : L().ops1(ops.length)}</div><div class="list">${esc(ops.join(' · '))}${ops.length > 1 ? ' — ' + esc(L().opsGoal) : ''}</div></div>`;
  drawMap(it);
  document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('on', CITIES[lang][+b.dataset.i][0] === name));
}
function idleHint() {
  $('#info').innerHTML = `<div class="hint">${esc(L().idle)}</div>`;
}

/* ---------- demo mode: cycles through cities when nobody touches the screen ---------- */
let demoTimer = null, idleTimer = null, demoIdx = 0, cursorTimer = null;
const IDLE = +(params.get('idle') || 60) * 1000, CYCLE = +(params.get('cycle') || 18) * 1000;
function startDemo() {
  $('#auto').classList.add('on');
  const step = () => { const c = CITIES[lang][demoIdx++ % CITIES[lang].length]; go(c[0], {lat: c[1], lon: c[2]}).then(() => $('#auto').classList.add('on')); };
  step();
  demoTimer = setInterval(step, CYCLE);
}
function stopDemo(user) {
  if (!user) return;
  clearInterval(demoTimer); demoTimer = null;
  $('#auto').classList.remove('on');
}
function touched() {
  stopDemo(true);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startDemo, IDLE);
  document.body.classList.remove('hidecursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.add('hidecursor'), 4000);
}
['pointerdown', 'keydown'].forEach(e => addEventListener(e, touched, {passive: true}));
addEventListener('pointermove', e => { if (Math.abs(e.movementX) + Math.abs(e.movementY) > 2) touched(); }, {passive: true});

$('#f').addEventListener('submit', e => { e.preventDefault(); const v = $('#q').value.trim(); if (v) { go(v); $('#q').blur(); } });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = CITIES[lang][+b.dataset.i]; $('#q').value = ''; go(c[0], {lat: c[1], lon: c[2]});
});
$('#lang').addEventListener('click', () => { lang = lang === 'en' ? 'de' : 'en'; if (current) current.name = current.name; applyLang(); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
});
addEventListener('resize', () => { renderDeps(); if (current) { const it = best(current.plan); if (it) drawMap(it); } });

applyLang();
tick(); setInterval(tick, 1000);
loadDeps(); setInterval(loadDeps, 60e3); setInterval(renderDeps, 15e3);
idleTimer = setTimeout(startDemo, params.has('demo') ? 1500 : IDLE);
// keep the screen awake on laptops and tablets that support it
if ('wakeLock' in navigator) { const w = () => navigator.wakeLock.request('screen').catch(() => {}); w(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && w()); }
</script>
